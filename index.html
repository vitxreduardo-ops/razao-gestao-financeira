<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razão — Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDF3EC;
    --paper-line: #C9D8CC;
    --ink: #1F3D2B;
    --ink-soft: #4C6455;
    --gold: #A9782E;
    --green: #2F6B4F;
    --red: #A6432D;
    --white: #F8FAF7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 34px,
      var(--paper-line) 35px
    );
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  .wrap { max-width: 780px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Spectral', serif;
    font-weight: 600;
    font-size: 32px;
    margin: 0;
    letter-spacing: 0.3px;
  }

  h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--ink-soft);
    font-size: 18px;
    display: block;
    margin-top: 2px;
  }

  .saldo {
    text-align: right;
  }

  .saldo .rotulo {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
  }

  .saldo .valor {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    border: 2px solid var(--ink);
    padding: 4px 12px;
    display: inline-block;
    margin-top: 4px;
    transform: rotate(-1deg);
    background: var(--white);
  }

  .valor.positivo { color: var(--green); border-color: var(--green); }
  .valor.negativo { color: var(--red); border-color: var(--red); }

  form {
    background: var(--white);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 32px;
    box-shadow: 0 1px 0 var(--paper-line);
  }

  form .full { grid-column: 1 / -1; }

  label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 4px;
  }

  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
  }

  input[type="number"] { font-family: 'IBM Plex Mono', monospace; }

  .tipo-toggle {
    display: flex;
    gap: 8px;
  }

  .tipo-toggle button {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    transition: all 0.15s;
  }

  .tipo-toggle button.ativo[data-tipo="receita"] {
    background: var(--green); color: white; border-color: var(--green);
  }
  .tipo-toggle button.ativo[data-tipo="despesa"] {
    background: var(--red); color: white; border-color: var(--red);
  }

  .btn-add {
    grid-column: 1 / -1;
    background: var(--ink);
    color: var(--white);
    border: none;
    padding: 12px;
    border-radius: 3px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-add:hover { background: var(--green); }
  .btn-add:disabled { opacity: 0.5; cursor: wait; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
  }

  th.num, td.num { text-align: right; }

  tbody td {
    padding: 10px 4px;
    border-bottom: 1px solid var(--paper-line);
    font-size: 14px;
    vertical-align: middle;
  }

  td.data, td.valor { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .categoria-tag {
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px solid var(--paper-line);
    padding: 2px 6px;
    border-radius: 10px;
    background: var(--white);
  }

  .valor.receita { color: var(--green); }
  .valor.despesa { color: var(--red); }

  .excluir {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 16px;
    opacity: 0.5;
  }
  .excluir:hover { opacity: 1; color: var(--red); }

  .vazio, .carregando, .erro {
    text-align: center;
    padding: 40px 0;
    color: var(--ink-soft);
    font-style: italic;
  }

  .erro { color: var(--red); }

  .setup-aviso {
    background: #FFF7E8;
    border: 1px solid var(--gold);
    color: #6b4f1a;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .setup-aviso code {
    background: rgba(0,0,0,0.06);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .painel-categorias {
    background: var(--white);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }

  .painel-categorias h2 {
    font-family: 'Spectral', serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
  }

  .barra-categoria { margin-bottom: 10px; }

  .barra-categoria .topo {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 3px;
  }

  .barra-categoria .nome { font-weight: 500; }
  .barra-categoria .total {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }

  .barra-fundo {
    height: 7px;
    background: var(--paper);
    border-radius: 4px;
    overflow: hidden;
  }

  .barra-preenchida {
    height: 100%;
    background: var(--gold);
    border-radius: 4px;
  }

  .tabela-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .tabela-topo h2 {
    font-family: 'Spectral', serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
  }

  .ordenar-select {
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: var(--white);
    color: var(--ink);
  }

  td.banco {
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Razão<em>controle financeiro</em></h1>
    <div class="saldo">
      <div class="rotulo">Saldo</div>
      <div class="valor" id="saldo-valor">—</div>
    </div>
  </header>

  <div id="setup-aviso" class="setup-aviso" style="display:none">
    Configure a URL do seu Apps Script no início do &lt;script&gt; deste arquivo:
    troque <code>SUA_URL_AQUI</code> pela URL que termina em <code>/exec</code>.
  </div>

  <form id="form-lancamento">
    <div>
      <label>Data</label>
      <input type="date" id="campo-data" required>
    </div>
    <div>
      <label>Valor (R$)</label>
      <input type="number" id="campo-valor" step="0.01" min="0" placeholder="0,00" required>
    </div>
    <div class="full">
      <label>Descrição</label>
      <input type="text" id="campo-descricao" placeholder="Ex: Supermercado, Salário..." required>
    </div>
    <div>
      <label>Categoria</label>
      <input type="text" id="campo-categoria" placeholder="Ex: Alimentação">
    </div>
    <div>
      <label>Banco</label>
      <input type="text" id="campo-banco" placeholder="Ex: Nubank, Itaú...">
    </div>
    <div>
      <label>Tipo</label>
      <div class="tipo-toggle">
        <button type="button" data-tipo="despesa" class="ativo">Despesa</button>
        <button type="button" data-tipo="receita">Receita</button>
      </div>
    </div>
    <button type="submit" class="btn-add" id="btn-salvar">Adicionar lançamento</button>
  </form>

  <div class="painel-categorias">
    <h2>Por categoria</h2>
    <div id="lista-categorias"></div>
  </div>

  <div class="tabela-topo">
    <h2>Lançamentos</h2>
    <select id="ordenar-select" class="ordenar-select">
      <option value="data-desc">Data (mais recente)</option>
      <option value="data-asc">Data (mais antiga)</option>
      <option value="categoria">Categoria</option>
      <option value="valor-desc">Valor (maior primeiro)</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Descrição</th>
        <th>Categoria</th>
        <th>Banco</th>
        <th class="num">Valor</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tabela-corpo">
      <tr><td colspan="5" class="carregando">Carregando lançamentos...</td></tr>
    </tbody>
  </table>

</div>

<script>
  // ============================================================
  // Troque pela URL do seu Apps Script (termina em /exec)
  const API_URL = "https://script.google.com/macros/s/AKfycby2IUAlWEFya5oiyOU0kPn0ardQwMLoiQAdMiLj8-5gW7CeNPABFV28WhPkzNDo8FJA/exec";
  // ============================================================

  const form = document.getElementById('form-lancamento');
  const tabelaCorpo = document.getElementById('tabela-corpo');
  const saldoValor = document.getElementById('saldo-valor');
  const btnSalvar = document.getElementById('btn-salvar');
  const tipoToggle = document.querySelectorAll('.tipo-toggle button');
  const ordenarSelect = document.getElementById('ordenar-select');
  const listaCategorias = document.getElementById('lista-categorias');
  let tipoSelecionado = 'despesa';
  let lancamentosAtuais = [];

  ordenarSelect.addEventListener('change', () => {
    renderizarTabela(ordenarLancamentos(lancamentosAtuais));
  });

  if (!API_URL || API_URL === 'SUA_URL_AQUI') {
    document.getElementById('setup-aviso').style.display = 'block';
  }

  document.getElementById('campo-data').valueAsDate = new Date();

  tipoToggle.forEach(btn => {
    btn.addEventListener('click', () => {
      tipoToggle.forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');
      tipoSelecionado = btn.dataset.tipo;
    });
  });

  function formatarMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function formatarDataBR(iso) {
    const [ano, mes, dia] = iso.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  async function carregarLancamentos() {
    try {
      const resp = await fetch(API_URL);
      const dados = await resp.json();

      if (!dados.ok) throw new Error('Resposta inválida');

      lancamentosAtuais = dados.lancamentos;
      renderizarTabela(ordenarLancamentos(lancamentosAtuais));
      renderizarCategorias(lancamentosAtuais);
      atualizarSaldo(lancamentosAtuais);
    } catch (err) {
      tabelaCorpo.innerHTML = `<tr><td colspan="6" class="erro">Não foi possível carregar os dados. Confira a URL da API.</td></tr>`;
    }
  }

  function ordenarLancamentos(lancamentos) {
    const copia = [...lancamentos];
    const criterio = ordenarSelect.value;

    if (criterio === 'data-asc') return copia.sort((a, b) => a.data.localeCompare(b.data));
    if (criterio === 'categoria') return copia.sort((a, b) => (a.categoria || '').localeCompare(b.categoria || ''));
    if (criterio === 'valor-desc') return copia.sort((a, b) => b.valor - a.valor);
    return copia.sort((a, b) => b.data.localeCompare(a.data)); // data-desc (padrão)
  }

  function renderizarTabela(lancamentos) {
    if (lancamentos.length === 0) {
      tabelaCorpo.innerHTML = `<tr><td colspan="6" class="vazio">Nenhum lançamento ainda.</td></tr>`;
      return;
    }

    tabelaCorpo.innerHTML = lancamentos.map(l => `
      <tr>
        <td class="data">${formatarDataBR(l.data)}</td>
        <td>${l.descricao}</td>
        <td>${l.categoria ? `<span class="categoria-tag">${l.categoria}</span>` : ''}</td>
        <td class="banco">${l.banco || ''}</td>
        <td class="num valor ${l.tipo}">${l.tipo === 'despesa' ? '−' : '+'} ${formatarMoeda(l.valor)}</td>
        <td><button class="excluir" onclick="excluirLancamento(${l.linha})" title="Excluir">✕</button></td>
      </tr>
    `).join('');
  }

  function renderizarCategorias(lancamentos) {
    if (lancamentos.length === 0) {
      listaCategorias.innerHTML = `<p class="vazio" style="padding:0;text-align:left;">Sem dados ainda.</p>`;
      return;
    }

    // Soma despesas por categoria (é o que costuma importar mais pra análise)
    const totais = {};
    lancamentos.filter(l => l.tipo === 'despesa').forEach(l => {
      const cat = l.categoria || 'Sem categoria';
      totais[cat] = (totais[cat] || 0) + l.valor;
    });

    const entradas = Object.entries(totais).sort((a, b) => b[1] - a[1]);

    if (entradas.length === 0) {
      listaCategorias.innerHTML = `<p class="vazio" style="padding:0;text-align:left;">Nenhuma despesa lançada ainda.</p>`;
      return;
    }

    const maior = entradas[0][1];

    listaCategorias.innerHTML = entradas.map(([categoria, total]) => `
      <div class="barra-categoria">
        <div class="topo">
          <span class="nome">${categoria}</span>
          <span class="total">${formatarMoeda(total)}</span>
        </div>
        <div class="barra-fundo">
          <div class="barra-preenchida" style="width:${(total / maior) * 100}%"></div>
        </div>
      </div>
    `).join('');
  }

  function atualizarSaldo(lancamentos) {
    const total = lancamentos.reduce((acc, l) => {
      return acc + (l.tipo === 'receita' ? l.valor : -l.valor);
    }, 0);
    saldoValor.textContent = formatarMoeda(total);
    saldoValor.classList.toggle('positivo', total >= 0);
    saldoValor.classList.toggle('negativo', total < 0);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Salvando...';

    const corpo = {
      data: document.getElementById('campo-data').value,
      descricao: document.getElementById('campo-descricao').value,
      categoria: document.getElementById('campo-categoria').value,
      banco: document.getElementById('campo-banco').value,
      tipo: tipoSelecionado,
      valor: document.getElementById('campo-valor').value
    };

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
        body: JSON.stringify(corpo)
      });
      form.reset();
      document.getElementById('campo-data').valueAsDate = new Date();
      await carregarLancamentos();
    } catch (err) {
      alert('Erro ao salvar. Confira sua conexão e a URL da API.');
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.textContent = 'Adicionar lançamento';
    }
  });

  async function excluirLancamento(linha) {
    if (!confirm('Excluir este lançamento?')) return;
    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ acao: 'excluir', linha })
      });
      await carregarLancamentos();
    } catch (err) {
      alert('Erro ao excluir.');
    }
  }

  carregarLancamentos();
</script>
</body>
</html>
